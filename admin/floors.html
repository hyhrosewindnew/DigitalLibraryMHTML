  // 总馆
  { id:1,  libraryId:1, name:'一层',     code:'ZG-1F', usage:'中文图书借阅区', area:2000, manager:'张丽', phone:'010-88880001', sort:1, status:1, remark:'' },
  { id:2,  libraryId:1, name:'二层',     code:'ZG-2F', usage:'外文书库',       area:1800, manager:'王强', phone:'010-88880002', sort:2, status:1, remark:'' },
  { id:3,  libraryId:1, name:'三层',     code:'ZG-3F', usage:'期刊阅览区',     area:1500, manager:'李敏', phone:'010-88880003', sort:3, status:1, remark:'仅限馆内阅览' },
  { id:4,  libraryId:1, name:'四层',     code:'ZG-4F', usage:'古籍特藏室',     area:800,  manager:'陈静', phone:'010-88880004', sort:4, status:1, remark:'需提前预约' },

  // 南区分馆
  { id:6,  libraryId:2, name:'一层',     code:'NQ-1F', usage:'综合借阅区',     area:1600, manager:'刘洋', phone:'020-66660001', sort:1, status:0, remark:'' },
  { id:7,  libraryId:2, name:'二层',     code:'NQ-2F', usage:'报刊阅览室',     area:1000, manager:'周婷', phone:'020-66660002', sort:2, status:0, remark:'' },

  // 东校区分馆
  { id:8,  libraryId:3, name:'一层',     code:'DQ-1F', usage:'借阅区',         area:1400, manager:'吴迪', phone:'020-77770001', sort:1, status:0, remark:'' },
  { id:9,  libraryId:3, name:'二层',     code:'DQ-2F', usage:'自习区',         area:900,  manager:'郑爽', phone:'020-77770002', sort:2, status:0, remark:'' },

  // 医学分馆
  { id:10, libraryId:4, name:'一层',     code:'YX-1F', usage:'医学书库',       area:1200, manager:'何静', phone:'020-88880001', sort:1, status:0, remark:'' },
  { id:11, libraryId:4, name:'二层',     code:'YX-2F', usage:'医学阅览室',     area:800,  manager:'杨帆', phone:'020-88880002', sort:2, status:0, remark:'整理中' }
];

let filters = { libraryId:'', keyword:'', status:'' };
let page = 1;
const PAGE_SIZE = 10;
let selected = new Set();
let editingId = null;
let nextId = 100;
let confirmCallback = null;

/* =========================================================
 *  工具
 * =======================================================*/
function getLibraryName(id){
  const lib = LIBRARIES.find(l => l.id === id);
  return lib ? lib.name : '—';
}

function calcSummary(){
  return {
    total: floors.length,
    on: floors.filter(f => f.status === 1).length
  };
}

/* =========================================================
 *  查询过滤
 * =======================================================*/
function getFiltered(){
  const kw = filters.keyword.toLowerCase();
  return floors
    .filter(it => {
      if (filters.libraryId && String(it.libraryId) !== filters.libraryId) return false;
      if (kw){
        const hit = it.name.toLowerCase().includes(kw) || it.code.toLowerCase().includes(kw);
        if (!hit) return false;
      }
      if (filters.status !== '' && String(it.status) !== filters.status) return false;
      return true;
    })
    .sort((a, b) => {
      if (a.libraryId !== b.libraryId) return a.libraryId - b.libraryId;
      return a.sort - b.sort || a.id - b.id;
    });
}

function getPageIds(){
  const list = getFiltered();
  const start = (page - 1) * PAGE_SIZE;
  return list.slice(start, start + PAGE_SIZE).map(i => i.id);
}

/* =========================================================
 *  导出
 * =======================================================*/
function exportCSV(){
  const list = getFiltered();
  if (!list.length) return toast('没有可导出的数据', 'error');

  const headers = ['所属馆藏地', '楼层名称', '楼层代码', '楼层用途', '面积(㎡)', '负责人', '联系电话', '排序', '状态', '备注'];
  const rows = list.map(it => [
    getLibraryName(it.libraryId),
    it.name,
    it.code,
    it.usage || '',
    it.area || '',
    it.manager || '',
    it.phone || '',
    it.sort,
    it.status ? '启用' : '停用',
    it.remark || ''
  ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));

  const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n'); // 加 BOM 防止中文乱码
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `楼层管理_${new Date().toISOString().slice(0, 10)}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
  toast('导出成功');
}

/* =========================================================
 *  渲染
 * =======================================================*/
function render(){
  const list = getFiltered();
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (page > totalPages) page = totalPages;
  if (page < 1) page = 1;

  const start = (page - 1) * PAGE_SIZE;
  const rows = list.slice(start, start + PAGE_SIZE);
  const tbody = $('tbody');

  if (!rows.length){
    tbody.innerHTML = `
      <tr>
        <td colspan="10">
          <div class="empty">
            <div class="empty-icon">🏢</div>
            <div class="empty-text">暂无符合条件的楼层</div>
          </div>
        </td>
      </tr>`;
  } else {
    tbody.innerHTML = rows.map(it => `
      <tr>
        <td class="col-check">
          <input type="checkbox" class="row-check" data-id="${it.id}" ${selected.has(it.id) ? 'checked' : ''}>
        </td>
        <td><span class="badge badge-blue">${esc(getLibraryName(it.libraryId))}</span></td>
        <td><div class="cell-main strong">${esc(it.name)}</div></td>
        <td><span class="code-text">${esc(it.code)}</span></td>
        <td>${esc(it.usage) || '<span style="color:#94a3b8;">—</span>'}</td>
        <td>${it.area ? it.area + ' ㎡' : '<span style="color:#94a3b8;">—</span>'}</td>
        <td>${esc(it.manager) || '<span style="color:#94a3b8;">—</span>'}</td>
        <td>${esc(it.phone) || '<span style="color:#94a3b8;">—</span>'}</td>
        <td>
          <label class="switch">
            <input type="checkbox" data-action="toggle" data-id="${it.id}" ${it.status ? 'checked' : ''}>
            <span class="slider"></span>
          </label>
        </td>
        <td class="ops">
          <button class="link-btn" data-action="edit" data-id="${it.id}">编辑</button>
          <button class="link-btn danger" data-action="del" data-id="${it.id}">删除</button>
        </td>
      </tr>
    `).join('');
  }

  const sum = calcSummary();
  $('statTotal').textContent = sum.total;
  $('statOn').textContent = sum.on;

  renderPager(total, totalPages, start, rows.length);
  updateSelectionUI();
}

function renderPager(total, totalPages, start, count){
  $('pagerInfo').innerHTML = total
    ? `共 <b>${total}</b> 条记录，当前第 ${start + 1}-${start + count} 条，第 ${page}/${totalPages} 页`
    : `共 0 条记录`;

  let pages = [];
  if (totalPages <= 7){
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else if (page <= 4){
    pages = [1, 2, 3, 4, 5, '...', totalPages];
  } else if (page >= totalPages - 3){
    pages = [1, '...', totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
  } else {
    pages = [1, '...', page - 1, page, page + 1, '...', totalPages];
  }

  const btns = [];
  btns.push(`<button class="pager-btn" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>上一页</button>`);
  pages.forEach(p => {
    if (p === '...') btns.push(`<span class="pager-dots">···</span>`);
    else btns.push(`<button class="pager-btn ${p === page ? 'active' : ''}" data-page="${p}">${p}</button>`);
  });
  btns.push(`<button class="pager-btn" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''}>下一页</button>`);

  const wrap = $('pagerBtns');
  wrap.innerHTML = btns.join('');

  wrap.querySelectorAll('button[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = Number(btn.dataset.page);
      if (p < 1 || p > totalPages || p === page) return;
      page = p;
      render();
      document.querySelector('.table-wrap').scrollIntoView({ behavior:'smooth', block:'nearest' });
    });
  });
}

function updateSelectionUI(){
  const pageIds = getPageIds();
  const allChecked = pageIds.length > 0 && pageIds.every(id => selected.has(id));
  const someChecked = pageIds.some(id => selected.has(id));
  const checkAll = $('checkAll');
  checkAll.checked = allChecked;
  checkAll.indeterminate = !allChecked && someChecked;

  const n = selected.size;
  const btn = $('btnBatchDel');
  btn.textContent = n ? `批量删除（${n}）` : '批量删除';
  btn.disabled = n === 0;
}

/* =========================================================
 *  事件
 * =======================================================*/
function bindEvents(){
  // 初始化筛选下拉
  const fLib = $('fLibrary');
  fLib.innerHTML = '<option value="">全部</option>'
    + LIBRARIES.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('');

  // 初始化表单中的馆藏地下拉
  const fLibId = $('fLibraryId');
  fLibId.innerHTML = LIBRARIES.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('');

  // 搜索
  $('btnSearch').addEventListener('click', () => {
    filters.libraryId = $('fLibrary').value;
    filters.keyword = $('fKeyword').value.trim();
    filters.status = $('fStatus').value;
    page = 1;
    render();
  });

  // 重置
  $('btnReset').addEventListener('click', () => {
    $('fLibrary').value = '';
    $('fKeyword').value = '';
    $('fStatus').value = '';
    filters = { libraryId:'', keyword:'', status:'' };
    page = 1;
    selected.clear();
    render();
  });

  // 导出
  $('btnExport').addEventListener('click', exportCSV);

  // 回车搜索
  $('fKeyword').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('btnSearch').click();
  });

  // 新增
  $('btnAdd').addEventListener('click', () => openForm());

  // 批量删除
  $('btnBatchDel').addEventListener('click', () => {
    if (!selected.size) return;
    askConfirm('批量删除', `确定要删除选中的 ${selected.size} 个楼层吗？删除后不可恢复。`, () => {
      floors = floors.filter(i => !selected.has(i.id));
      selected.clear();
      toast('批量删除成功');
      render();
    });
  });

  // 全选
  $('checkAll').addEventListener('change', e => {
    const pageIds = getPageIds();
    pageIds.forEach(id => e.target.checked ? selected.add(id) : selected.delete(id));
    render();
  });

  // 表格事件委托
  const tbody = $('tbody');
  tbody.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.tagName === 'INPUT') return;
    const action = btn.dataset.action;
    const id = Number(btn.dataset.id);
    if (action === 'edit') openForm(id);
    if (action === 'del') {
      const item = floors.find(i => i.id === id);
      askConfirm('删除楼层', `确定要删除「${getLibraryName(item.libraryId)} - ${item.name}」吗？删除后不可恢复。`, () => {
        floors = floors.filter(i => i.id !== id);
        selected.delete(id);
        toast('删除成功');
        render();
      });
    }
  });

  tbody.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.action === 'toggle') {
      const id = Number(el.dataset.id);
      const item = floors.find(i => i.id === id);
      if (!item) return;
      item.status = el.checked ? 1 : 0;
      toast(el.checked ? `「${item.name}」已启用` : `「${item.name}」已停用`);
      render();
      return;
    }
    if (el.classList.contains('row-check')) {
      const id = Number(el.dataset.id);
      el.checked ? selected.add(id) : selected.delete(id);
      updateSelectionUI();
    }
  });

  // 表单弹窗
  $('btnCloseForm').addEventListener('click', closeForm);
  $('btnCancelForm').addEventListener('click', closeForm);
  $('btnSubmitForm').addEventListener('click', submitForm);
  $('formModal').addEventListener('click', e => {
    if (e.target === $('formModal')) closeForm();
  });

  // 确认弹窗
  $('btnCloseConfirm').addEventListener('click', closeConfirm);
  $('btnCancelConfirm').addEventListener('click', closeConfirm);
  $('btnOkConfirm').addEventListener('click', () => {
    const cb = confirmCallback;
    closeConfirm();
    if (cb) cb();
  });
  $('confirmModal').addEventListener('click', e => {
    if (e.target === $('confirmModal')) closeConfirm();
  });

  // ESC
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('confirmModal').classList.contains('show')) closeConfirm();
    else if ($('formModal').classList.contains('show')) closeForm();
  });
}

/* =========================================================
 *  表单
 * =======================================================*/
function clearFormErrors(){
  document.querySelectorAll('#formModal .form-item').forEach(el => el.classList.remove('has-error'));
  document.querySelectorAll('#formModal .error-tip').forEach(el => el.textContent = '');
}

function setFormError(id, msg){
  const el = $(id);
  const item = el.closest('.form-item');
  if (!item) return;
  item.classList.add('has-error');
  const tip = item.querySelector('.error-tip');
  if (tip) tip.textContent = msg;
}

function openForm(id){
  editingId = id ?? null;
  clearFormErrors();

  $('fLibraryId').selectedIndex = 0;
  $('fName').value = '';
  $('fCode').value = '';
  $('fUsage').value = '';
  $('fArea').value = '';
  $('fManager').value = '';
  $('fPhone').value = '';
  $('fRemark').value = '';
  document.querySelector('input[name="fStatus"][value="1"]').checked = true;

  if (id){
    const it = floors.find(f => f.id === id);
    if (!it) return;
    $('formTitle').textContent = '编辑楼层';
    $('fLibraryId').value = String(it.libraryId);
    $('fName').value = it.name;
    $('fCode').value = it.code;
    $('fUsage').value = it.usage || '';
    $('fArea').value = it.area || '';
    $('fManager').value = it.manager || '';
    $('fPhone').value = it.phone || '';
    $('fSort').value = it.sort;
    $('fRemark').value = it.remark || '';
    document.querySelector(`input[name="fStatus"][value="${it.status}"]`).checked = true;
  } else {
    $('formTitle').textContent = '新增楼层';
    const maxSort = floors.reduce((m, f) => Math.max(m, f.sort), 0);
    $('fSort').value = maxSort + 1;
  }

  $('formModal').classList.add('show');
  setTimeout(() => $('fLibraryId').focus(), 60);
}

function closeForm(){
  $('formModal').classList.remove('show');
  editingId = null;
}

function isCodeExists(code, excludeId){
  return floors.some(f => f.code.toLowerCase() === code.toLowerCase() && f.id !== excludeId);
}

function submitForm(){
  clearFormErrors();

  const libraryId = Number($('fLibraryId').value);
  const name      = $('fName').value.trim();
  const code      = $('fCode').value.trim();
  const usage     = $('fUsage').value.trim();
  const area      = Number($('fArea').value) || 0;
  const manager   = $('fManager').value.trim();
  const phone     = $('fPhone').value.trim();
  const sort      = Number($('fSort').value) || 0;
  const status    = Number(document.querySelector('input[name="fStatus"]:checked').value);
  const remark    = $('fRemark').value.trim();

  let ok = true;

  if (!name){ setFormError('fName', '请输入楼层名称'); ok = false; }
  if (!code){
    setFormError('fCode', '请输入楼层代码'); ok = false;
  } else if (!/^[A-Za-z0-9\-_]{1,30}$/.test(code)){
    setFormError('fCode', '代码仅支持字母、数字、- 和 _，长度 1-30'); ok = false;
  } else if (isCodeExists(code, editingId)){
    setFormError('fCode', '该楼层代码已存在'); ok = false;
  }

  if (!ok) return;

  if (editingId){
    const it = floors.find(f => f.id === editingId);
    if (it) Object.assign(it, { libraryId, name, code, usage, area, manager, phone, sort, status, remark });
    toast('保存成功');
  } else {
    floors.push({
      id: nextId++, libraryId, name, code, usage, area, manager, phone, sort, status, remark
    });
    toast('新增成功');
  }

  closeForm();
  render();
}

/* =========================================================
 *  确认弹窗
 * =======================================================*/
function askConfirm(title, text, cb){
  $('confirmTitle').textContent = title;
  $('confirmText').textContent = text;
  confirmCallback = cb;
  $('confirmModal').classList.add('show');
}

function closeConfirm(){
  $('confirmModal').classList.remove('show');
  confirmCallback = null;
}

/* =========================================================
 *  初始化
 * =======================================================*/
function init(){
  bindEvents();
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
